<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Spark Labs - 24시간 팀 운영 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #666;
            font-size: 1em;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .team-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .team-card .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .team-card .avatar {
            font-size: 3em;
            margin-right: 15px;
        }

        .team-card .info h3 {
            font-size: 1.4em;
            margin-bottom: 5px;
            color: #333;
        }

        .team-card .info .role {
            color: #666;
            font-size: 0.9em;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 5px;
        }

        .status-available {
            background: #d4edda;
            color: #155724;
        }

        .status-working {
            background: #fff3cd;
            color: #856404;
        }

        .task-list {
            margin-top: 15px;
        }

        .task-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-completed {
            background: #d4edda;
            color: #155724;
        }

        .task-pending {
            background: #f8f9fa;
            color: #666;
        }

        .task-icon {
            margin-right: 8px;
            font-size: 1.2em;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .update-time {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            margin: 20px auto;
            display: block;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }

        .phase-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .phase-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .loading {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Spark Labs - 24시간 팀 운영</h1>
            <p class="subtitle">실시간 작업 진행 현황 대시보드 (5분마다 자동 업데이트)</p>
            <button class="refresh-btn" onclick="loadData()">🔄 수동 새로고침</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">⏰</div>
                <div class="value" id="current-hour">0</div>
                <div class="label">현재 Hour / 24</div>
            </div>
            <div class="stat-card">
                <div class="icon">✅</div>
                <div class="value" id="completed-tasks">0</div>
                <div class="label">완료된 작업</div>
            </div>
            <div class="stat-card">
                <div class="icon">📋</div>
                <div class="value" id="total-tasks">40</div>
                <div class="label">전체 작업</div>
            </div>
            <div class="stat-card">
                <div class="icon">📈</div>
                <div class="value" id="completion-rate">0%</div>
                <div class="label">진행률</div>
            </div>
        </div>

        <div class="phase-section">
            <h2>📊 전체 진행 상황</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="overall-progress" style="width: 0%">0%</div>
            </div>
        </div>

        <h2 style="color: white; text-align: center; margin: 30px 0; font-size: 2em;">👥 팀원별 작업 현황</h2>

        <div class="team-grid" id="team-grid">
            <!-- 팀원 카드가 여기에 동적으로 추가됩니다 -->
        </div>

        <div class="update-time">
            마지막 업데이트: <span id="update-time">-</span>
        </div>
    </div>

    <script>
        const teamMembers = {
            'PM': { name: 'Alex', role: 'Product Manager', icon: '👔', color: '#667eea' },
            'Designer': { name: 'Maya', role: 'UI/UX Designer', icon: '🎨', color: '#f093fb' },
            'Frontend': { name: 'Chris', role: 'Frontend Engineer', icon: '💻', color: '#4facfe' },
            'Backend': { name: 'Jordan', role: 'Backend Engineer', icon: '⚙️', color: '#43e97b' },
            'Growth': { name: 'Sam', role: 'Growth Specialist', icon: '📈', color: '#fa709a' }
        };

        async function loadData() {
            try {
                // reports/24h_operations/ 폴더에서 최신 progress 파일 찾기
                const response = await fetch('reports/24h_operations/progress_hour_00.json');

                if (!response.ok) {
                    console.log('아직 리포트가 생성되지 않았습니다.');
                    setTimeout(loadData, 3000); // 3초 후 재시도
                    return;
                }

                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('데이터 로딩 실패:', error);
                // 실패해도 계속 시도
                setTimeout(loadData, 3000);
            }
        }

        function updateDashboard(data) {
            // 전체 통계 업데이트
            document.getElementById('current-hour').textContent = data.hour;
            document.getElementById('completed-tasks').textContent = data.progress.completed;
            document.getElementById('total-tasks').textContent = data.progress.total_tasks;
            document.getElementById('completion-rate').textContent = data.progress.completion_rate;

            // 진행바 업데이트
            const progressPercent = parseFloat(data.progress.completion_rate);
            const progressBar = document.getElementById('overall-progress');
            progressBar.style.width = progressPercent + '%';
            progressBar.textContent = data.progress.completion_rate;

            // 팀원별 카드 업데이트
            const teamGrid = document.getElementById('team-grid');
            teamGrid.innerHTML = '';

            for (const [key, member] of Object.entries(teamMembers)) {
                const memberData = data.team_status[key];
                const memberTasks = Object.entries(data.tasks)
                    .filter(([taskId, task]) => task.assigned_to === key)
                    .map(([taskId, task]) => ({ id: taskId, ...task }));

                const card = createTeamCard(key, member, memberData, memberTasks);
                teamGrid.appendChild(card);
            }

            // 업데이트 시간
            const now = new Date();
            document.getElementById('update-time').textContent = now.toLocaleTimeString('ko-KR');
        }

        function createTeamCard(key, member, memberData, tasks) {
            const card = document.createElement('div');
            card.className = 'team-card';

            const completedTasks = tasks.filter(t => t.status === 'completed');
            const pendingTasks = tasks.filter(t => t.status === 'pending');
            const progressPercent = tasks.length > 0 ? (completedTasks.length / tasks.length * 100).toFixed(0) : 0;

            card.innerHTML = `
                <div class="header-row">
                    <div class="avatar">${member.icon}</div>
                    <div class="info" style="flex: 1;">
                        <h3>${member.name}</h3>
                        <div class="role">${member.role}</div>
                        <div class="status-badge status-${memberData.status}">
                            ${memberData.status === 'available' ? '🟢 대기중' : '🔄 작업중'}
                        </div>
                    </div>
                </div>

                <div class="progress-bar" style="height: 20px;">
                    <div class="progress-fill" style="width: ${progressPercent}%; background: ${member.color};">
                        ${progressPercent}%
                    </div>
                </div>

                <div style="margin: 15px 0; font-weight: bold; color: #666;">
                    완료: ${completedTasks.length} / ${tasks.length}
                </div>

                <div class="task-list">
                    <div style="font-weight: bold; margin-bottom: 10px; color: #333;">✅ 완료된 전체 작업</div>
                    ${completedTasks.length > 0 ? completedTasks.map(task => `
                        <div class="task-item task-completed">
                            <span>
                                <span class="task-icon">✓</span>
                                ${task.title}
                            </span>
                            <span style="font-size: 0.8em; color: #28a745;">[${task.priority}] Phase ${task.phase}</span>
                        </div>
                    `).join('') : '<div style="color: #999; padding: 10px;">아직 완료된 작업이 없습니다</div>'}

                    ${pendingTasks.length > 0 ? `
                        <div style="font-weight: bold; margin: 15px 0 10px 0; color: #333;">⏳ 대기중인 작업</div>
                        ${pendingTasks.map(task => `
                            <div class="task-item task-pending">
                                <span>
                                    <span class="task-icon">○</span>
                                    ${task.title}
                                </span>
                                <span style="font-size: 0.8em; color: #666;">[${task.priority}] Phase ${task.phase}</span>
                            </div>
                        `).join('')}
                    ` : ''}
                </div>
            `;

            return card;
        }

        // 페이지 로드 시 데이터 로딩 시작
        loadData();

        // 5분마다 자동 새로고침
        setInterval(loadData, 300000);
    </script>
</body>
</html>
